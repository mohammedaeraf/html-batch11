<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lists Demo</title>
    <style>
      body {
        font-family: Arial;
        background-color: rgb(240, 240, 240);
      }
      h1 {
        text-align: center;
        text-transform: uppercase;
        color: rgb(4, 61, 9);
      }
      h1:hover {
        color: rgb(11, 137, 21);
      }
      .white-box > h2 {
        color: rgb(135, 7, 7);
        text-decoration: underline;
        text-decoration-color: rgb(172, 3, 3);
      }
      ol,
      ul {
        color: purple;
        line-height: 30px;
        font-size: 18px;
      }
      .white-box {
        background-color: white;
        margin: 15px;
        padding: 16px;
        border-radius: 7px;
      }
      .list-1 {
        text-decoration: underline;
      }
      .list-1 > li:hover {
        color: gray;
      }
      .list-2 {
        font-weight: bold;
      }
      .list-2 > li:hover {
        text-decoration: underline;
      }
      ul {
        list-style-type: circle;
      }
      ol {
        list-style-type: upper-alpha;
      }
    </style>
  </head>
  <body>
    <h1>My Daily Routine</h1>
    <div class="white-box">
      <h2>Morning Tasks</h2>
      <ol class="list-2">
        <li>Wake Up</li>
        <li>Brush Teeth</li>
        <li>Jog for 30 mins</li>
        <li>Workout for 20 mins</li>
        <li>Take Bath</li>
        <li>Have Breakfast</li>
        <li>Go to College</li>
      </ol>
    </div>
    <h2>Another Heading 2 outside Box</h2>
  </body>
</html>
