<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BS Grid Layout</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container-fluid">
      <div class="row">
        <div
          class="col-12 col-sm-6 col-md-4 col-lg-3 bg-primary text-white p-4"
        >
          Col 1
        </div>
        <div
          class="col-12 col-sm-6 col-md-4 col-lg-3 bg-success text-white p-4"
        >
          Col 2
        </div>
        <div
          class="col-12 col-sm-6 col-md-4 col-lg-3 bg-warning text-white p-4"
        >
          Col 3
        </div>
        <div class="col-12 col-sm-6 col-md-4 col-lg-3 bg-danger text-white p-4">
          Col 4
        </div>
      </div>
    </div>
  </body>
</html>
