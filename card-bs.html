<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BS Card</title>
    <link rel="shortcut icon" href="img/favicon.png" type="image/x-icon" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="card" style="width: 320px">
      <img
        src="img/taj-mahal.jpg"
        class="card-img-top"
        alt="Taj Mahal monument in Agra"
      />
      <div class="card-body">
        <h5 class="card-title">Taj Mahal (Agra)</h5>
        <p class="card-text">
          The Taj Mahal is a stunning white marble mausoleum in Agra, India,
          built by Mughal Emperor Shah Jahan in memory of his wife Mumtaz Mahal.
          Completed in 1648, it is renowned for its symmetrical design,
          intricate carvings, and beautiful gardens.
        </p>
        <a href="card.html" class="btn btn-success">Book a Tour</a>
      </div>
    </div>
  </body>
</html>
