<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Card Demo</title>
    <style>
      body {
        font-family: Arial;
      }
      h2 {
        font-family: "Segoe UI";
        padding: 10px;
        color: brown;
      }
      p {
        padding: 10px;
      }
      .card {
        width: 400px;
        /* border: 1px solid gray; */
        box-shadow: 4px 4px 9px gray;
        padding: 8px;
      }
      .card > img {
        width: 100%;
      }
      .card > a {
        background-color: green;
        color: white;
        text-decoration: none;
        padding: 8px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="img/tajmahal.jpg" alt="Taj Mahal monument in Agra" />
      <h2>Taj Mahal (Agra)</h2>
      <p>
        The Taj Mahal is a stunning white marble mausoleum in Agra, India, built
        by Mughal Emperor Shah Jahan in memory of his wife Mumtaz Mahal.
        Completed in 1648, it is renowned for its symmetrical design, intricate
        carvings, and beautiful gardens.
      </p>

      <a href="bs-demo.html">Book a Tour</a>
    </div>
  </body>
</html>
