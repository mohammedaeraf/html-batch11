<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      .container {
        display: flex;
        justify-content: space-evenly;
        align-items: center;
        flex-wrap: wrap;
        flex-direction: row;
        gap: 10px;

        min-height: 250px;
        
        padding: 10px;
      }
      .box {
        width: 300px;
        height: 250px;
        color: white;
        text-align: center;
        font-weight: bold;
        font-size: 24px;
        padding-top: 25px;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <div class="container border border-2 border-dark">
      <div class="box bg-primary">1</div>
      <div class="box bg-success">2</div>
      <div class="box bg-warning">3</div>
      <div class="box bg-danger">4</div>
      <div class="box bg-info">5</div>
      <div class="box bg-dark">6</div>
    </div>
  </body>
</html>
