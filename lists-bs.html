<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lists Demo</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <h1 class="text-center text-primary my-4">My Daily Routine</h1>
    <div>
      <h2 class="m-3 mb-4 text-bg-danger p-3">Morning Tasks</h2>
      <ul class="list-group m-3">
        <li class="list-group-item active">Wake Up</li>
        <li class="list-group-item">Brush Teeth</li>
        <li class="list-group-item">Jog for 30 mins</li>
        <li class="list-group-item">Workout for 20 mins</li>
        <li class="list-group-item">Take Bath</li>
        <li class="list-group-item">Have Breakfast</li>
        <li class="list-group-item">Go to College</li>
      </ul>
    </div>
    <h2>Another Heading 2 outside Box</h2>
  </body>
</html>
