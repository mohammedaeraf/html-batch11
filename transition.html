<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transition Demo</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      h2 {
        cursor: pointer;
      }
      button {
        background-color: royalblue;
        color: white;
        padding: 10px 20px;
        border: none;
        border-radius: 4px;

        /* Transition */
        transition: 0.4s;
      }
      button:hover {
        /* box-shadow: 0px 10px 10px rgb(67, 67, 222); */
        /* background-color: green; */
        /* transform: scale(1.1); */
        /* transform: rotate(-10deg); */
        transform: translateY(-10px);
      }
    </style>
  </head>
  <body>
    <div class="container text-center">
      <h2 class="text-warning mt-5">Transition Demo</h2>
      <button class="mt-4">Hover Me</button>
    </div>
  </body>
</html>
